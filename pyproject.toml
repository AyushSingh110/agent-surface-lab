[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-surface-lab"
version = "0.0.1"
description = "Empirical studies on LLM-agent behavior: recovery (detection is not repair) and tool-description adversarial surface."
requires-python = ">=3.10"

# Runtime dependencies are kept deliberately minimal for the Recovery kill test.
# Every entry is flagged and justified below; heavier deps for later phases are
# listed as commented placeholders and are NOT installed until their phase begins.
dependencies = [
    # Official Python client for the local Ollama server — the only backbone.
    "ollama>=0.3,<1.0",
    # Config files as dataclass-friendly YAML.
    "pyyaml>=6.0,<7.0",
    # Loads .env (OLLAMA_HOST / OLLAMA_MODEL / SEED) without hardcoding.
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    # Test the recorder, replay layer, and metric math.
    "pytest>=8.0,<9.0",
]

# ---------------------------------------------------------------------------
# DEFERRED dependencies — flagged now, added only when their phase starts.
# Do not install these yet; listed so the plan is transparent.
#
#   Idea B (predictor / Pareto):   numpy, scikit-learn, xgboost, matplotlib
#   paper-toolseo (Idea C attacker): dspy-ai
#   embedding-drift features (B):   a local embedding model via Ollama (no new pip dep expected)
#
# Each will be proposed for approval before being added.
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "recovery_sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
